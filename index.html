<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pulse AI</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <div id="downloadScreen" class="screen">
    <div class="pulseLogo">PULSE</div>
    <p>Your AI assistant</p>

    <button id="downloadBrainBtn">
      Download AI Brain
    </button>

    <div id="downloadStatus"></div>

    <div class="progress">
      <div id="progressBar"></div>
    </div>
  </div>


  <main id="app" class="hidden">

    <header>
      <div class="logo">PULSE</div>

      <button id="talkButton">
        🗣️ Talk by Itself
      </button>
    </header>


    <!-- CHAT MESSAGES -->
    <div id="chat"></div>


    <!-- IMAGE PREVIEW -->
    <div id="imagePreviewContainer" class="hidden">
      <img id="imagePreview">
      <button id="removeImage">×</button>
    </div>


    <!-- CHAT INPUT -->
    <div class="chatBar">

      <label class="smallButton">
        📷
        <input
          id="imageInput"
          type="file"
          accept="image/*"
          hidden
        >
      </label>

      <button
        id="micButton"
        class="smallButton"
        type="button"
      >
        🎤
      </button>

      <input
        id="messageInput"
        type="text"
        placeholder="Type a message..."
        autocomplete="off"
        enterkeyhint="send"
      >

      <button
        id="sendButton"
        class="sendButton"
        type="button"
      >
        ➤
      </button>

    </div>


    <div id="status"></div>

  </main>


  <script type="module" src="script.js"></script>

</body>
</html>
